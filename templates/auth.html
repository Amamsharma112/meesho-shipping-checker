
{% extends 'base.html' %}{% block body %}<section class="auth card"><div class="eyebrow">SELLER TOOLS</div><h1>{{ 'Create account' if mode=='register' else 'Welcome back' }}</h1><p class="muted">Upload batches and keep shipping-check history in one place.</p><form method="post" class="stack"><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" minlength="10" required autocomplete="{{ 'new-password' if mode=='register' else 'current-password' }}"></label><button class="primary">{{ 'Create free account' if mode=='register' else 'Login' }}</button></form><p>{% if mode=='register' %}Already registered? <a href="{{url_for('login')}}">Login</a>{% else %}New here? <a href="{{url_for('register')}}">Create account</a>{% endif %}</p></section>{% endblock %}
