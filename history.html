{% extends 'base.html' %}{% block body %}<div class="pagehead"><div><div class="eyebrow">YOUR ACCOUNT</div><h1>Processing history</h1></div></div><section class="card"><div class="tablewrap"><table><thead><tr><th>Job</th><th>Date</th><th>Images</th><th>Status</th><th></th></tr></thead><tbody>{% for j in jobs %}<tr><td>#{{j.id}}</td><td>{{j.created_at.strftime('%Y-%m-%d %H:%M')}}</td><td>{{j.total}}</td><td>{{j.status}}</td><td><a href="{{url_for('job_detail',job_id=j.id)}}">Open</a></td></tr>{% else %}<tr><td colspan="5">No history yet.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
